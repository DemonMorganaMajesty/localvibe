# =====================================================================
# 城遇(localvibe) · OpenResty 配置(端口 8085，conf 与 lua 分离)
# ---------------------------------------------------------------------
# 部署位置：
#   conf: /usr/local/openresty/nginx/conf/localvibe.conf  (nginx.conf 已 include)
#   lua:  /usr/local/openresty/nginx/lua/localvibe.lua
# 链路：浏览器 -> Windows nginx(82) -> OpenResty(8085)
#       L1: ngx.shared.localvibe_cache  (OpenResty 进程内本地缓存)
#       L2: Redis db8                   (Java/canal 维护 或 lua 自管短TTL键)
#       L3: /path/ 内部代理             -> Tomcat 集群(8084/8086)
# 三级缓存接口(均交给 localvibe.lua，按 URI 分发)：
#       /api/shop/{id}       -> 店铺详情   (键 cache:shop:id{id})
#       /api/shop-type/list  -> 店铺分类   (键 cache:shopType:string)
#       /api/blog/{id}       -> 帖子详情内容(键 localvibe:blog:id:{id})
# 其余 /api/* 去掉 /api 前缀后按 Project4 路由规则反代 Tomcat 集群
# 说明：应用后 Windows nginx(82) 的 /api 反代需改为 http://127.0.0.1:8085
# =====================================================================

# 实现 nginx 的本地缓存：添加共享词典实现缓存 名称 大小(m)

worker_processes  1;
error_log  logs/error.log;
events {
    worker_connections  1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    # 实现从库里面读取工具
    lua_package_path "/usr/local/openresty/lualib/?.lua;;";
    lua_package_cpath "/usr/local/openresty/lualib/?.so;;";

# =====================================================================
# 城遇(localvibe) · OpenResty 配置(端口 8085，conf 与 lua 合并至 nginx.conf)
# ---------------------------------------------------------------------
# 部署位置：
#   lua:  /usr/local/openresty/nginx/lua/localvibe.lua
# 链路：浏览器 -> Windows nginx(82) -> OpenResty(8085)
#       L1: ngx.shared.localvibe_cache  (OpenResty 进程内本地缓存)
#       L2: Redis db8                   (Java/canal 维护 或 lua 自管短TTL键)
#       L3: /path/ 内部代理             -> Tomcat 集群(8084/8086)
# 三级缓存接口(均交给 localvibe.lua，按 URI 分发)：
#       /api/shop/{id}       -> 店铺详情   (键 cache:shop:id{id})
#       /api/shop-type/list  -> 店铺分类   (键 cache:shopType:string)
#       /api/blog/{id}       -> 帖子详情内容(键 localvibe:blog:id:{id})
# 其余 /api/* 去掉 /api 前缀后按 Project4 路由规则反代 Tomcat 集群
# 说明：应用后 Windows nginx(82) 的 /api 反代需改为 http://127.0.0.1:8085
# =====================================================================
# 实现 nginx 的本地缓存：添加共享词典实现缓存 名称 大小(m)
lua_shared_dict localvibe_cache 150m;
# 反向代理到集群(发请求给后端集群,获取数据)
upstream localvibe-cluster {
        # 实现负载均衡：同一请求(根据URI)只会去同一台 Tomcat(hash 算法类似取模)
        hash $request_uri;
        server 172.24.112.1:8084;
        server 172.24.112.1:8086 down;  # 8086 未启动时标记 down，避免轮询超时
}
server {
    listen       8085;
    server_name  _;
    # 项目专属访问/错误日志(日志名同步改为 localvibe)
    access_log logs/localvibe-access.log;
    error_log  logs/localvibe-error.log;
    # 内部代理路径，仅 lua 内部 capture 访问(回源 Tomcat 集群)
    location /path/ {
        internal;
        proxy_pass http://localvibe-cluster/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
    # ==================== 店铺详情三级缓存 ====================
    # /api/shop/{id} 捕获店铺ID 交给 localvibe.lua
    location ~ ^/api/shop/(\d+)$ {
        set $id $1;
        default_type application/json;
        content_by_lua_file /usr/local/openresty/nginx/lua/localvibe.lua;
    }
    # ==================== 店铺分类列表三级缓存 ====================
    location = /api/shop-type/list {
        default_type application/json;
        content_by_lua_file /usr/local/openresty/nginx/lua/localvibe.lua;
    }
    # ==================== 热门门店列表三级缓存 ====================
    location = /api/shop/hot {
        default_type application/json;
        content_by_lua_file /usr/local/openresty/nginx/lua/localvibe.lua;
    }
    # ==================== 帖子详情内容三级缓存 ====================
    # /api/blog/{id} 捕获帖子ID 交给 localvibe.lua
    location ~ ^/api/blog/(\d+)$ {
        set $id $1;
        default_type application/json;
        content_by_lua_file /usr/local/openresty/nginx/lua/localvibe.lua;
    }
    # 其余 /api/* 统一反代后端集群(去掉 /api 前缀，按 Project4 路由规则)
    location /api/ {
        rewrite ^/api(/.*) $1 break;
        proxy_pass http://localvibe-cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
    location / {
        root   html;
        index  index.html index.htm;
    }
    # 错误页面配置
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}

}
